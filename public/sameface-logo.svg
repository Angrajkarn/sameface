    <rect x="98" y="28" width="7" height="10" rx="2.5"/>
    <rect x="98" y="55" width="7" height="10" rx="2.5"/>
    <rect x="98" y="82" width="7" height="10" rx="2.5"/>
  </g>
  <!-- two identical eyes -->
  <circle cx="46" cy="50" r="9" fill="#FFF4D6"/>
  <circle cx="74" cy="50" r="9" fill="#FFF4D6"/>
  <circle cx="48" cy="51" r="4.5" fill="#1F1B3A"/>
  <circle cx="76" cy="51" r="4.5" fill="#1F1B3A"/>
